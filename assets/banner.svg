<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d0d"/>
      <stop offset="100%" stop-color="#17171a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3987e5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3987e5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- core strip: 6 LITTLE + 2 big, the topology the whole project is about.
       The two lit cells on the left cluster and the two on the right are the
       'balanced' mask 0xCF - what the tool actually picks on this device. -->
  <g transform="translate(96, 128)">
    <text x="0" y="0" font-size="15" fill="#898781" letter-spacing="2.5">6 × CORTEX-A55</text>
    <text x="452" y="0" font-size="15" fill="#898781" letter-spacing="2.5">2 × A75</text>

    <g transform="translate(0, 18)">
      <rect x="0"   y="0" width="60" height="60" rx="9" fill="#3987e5"/>
      <rect x="70"  y="0" width="60" height="60" rx="9" fill="#3987e5"/>
      <rect x="140" y="0" width="60" height="60" rx="9" fill="#3987e5"/>
      <rect x="210" y="0" width="60" height="60" rx="9" fill="#3987e5"/>
      <rect x="280" y="0" width="60" height="60" rx="9" fill="#232326"/>
      <rect x="350" y="0" width="60" height="60" rx="9" fill="#232326"/>
      <rect x="452" y="0" width="60" height="60" rx="9" fill="#3987e5"/>
      <rect x="522" y="0" width="60" height="60" rx="9" fill="#3987e5"/>
    </g>
    <text x="0" y="106" font-size="14" fill="#5c5b57">
      lit = cores this workload should actually use
    </text>
  </g>

  <text x="96" y="330" font-size="86" font-weight="700" fill="#ffffff" letter-spacing="-2">LITTLETai</text>

  <text x="96" y="380" font-size="24" fill="#c3c2b7">
    The right number of threads is never all of them.
  </text>

  <rect x="96" y="424" width="1088" height="1" fill="#2c2c2a"/>

  <!-- the three numbers, as a stat row -->
  <g transform="translate(96, 470)">
    <text x="0" y="34" font-size="46" font-weight="700" fill="#3987e5">2.2–11×</text>
    <text x="0" y="64" font-size="15" fill="#898781">faster token generation</text>

    <text x="330" y="34" font-size="46" font-weight="700" fill="#3987e5">up to 11×</text>
    <text x="330" y="64" font-size="15" fill="#898781">less energy per token</text>

    <text x="680" y="34" font-size="46" font-weight="700" fill="#3987e5">0</text>
    <text x="680" y="64" font-size="15" fill="#898781">lines patched in llama.cpp</text>
  </g>

  <rect x="0" y="0" width="1280" height="640" fill="url(#fade)" style="mix-blend-mode:screen"/>
</svg>
